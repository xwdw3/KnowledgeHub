# Secret 示例：**不要提交真实值到 git**
#
# 正确做法（三选一，按企业现状）：
#   1. 云厂商 Secret Manager + External Secrets Operator（推荐）
#      清单里只留 ExternalSecret 引用，密钥自动同步成 K8s Secret
#   2. Sealed Secrets / SOPS：加密后的密文可以安全提交
#   3. 部署时手工创建：kubectl create secret generic ... --from-literal=...
#
# 本文件只列出**必须**提供哪些键，值为占位符。
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-kb-secret
  namespace: rag-kb
type: Opaque
stringData:
  # ---- 数据库 ----
  # 多副本共用同一个库；不能各自起 SQLite，否则 A 传的文档 B 看不到
  DATABASE_URL: "postgresql://raguser:CHANGE_ME@postgres.rag-kb.svc.cluster.local:5432/rag_db"

  # ---- Redis ----
  # 三处用途，必须都是同一个实例：
  #   1. 两级缓存（L2）
  #   2. Celery broker（/0）
  #   3. Celery result（/1）
  #   4. OIDC state / SSO 一次性票据（**多副本登录能互通的前提**）
  REDIS_URL: "redis://redis.rag-kb.svc.cluster.local:6379/0"
  # KEDA 用这个键读队列长度（格式与 REDIS_URL 不同，是 host:port）
  REDIS_ADDRESS: "redis.rag-kb.svc.cluster.local:6379"
  CELERY_BROKER_URL: "redis://redis.rag-kb.svc.cluster.local:6379/0"
  CELERY_RESULT_URL: "redis://redis.rag-kb.svc.cluster.local:6379/1"

  # ---- 对象存储 ----
  MINIO_ENDPOINT: "minio.rag-kb.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"

  # ---- JWT ----
  # **所有副本必须一致**。写在 Secret 里就是为了防止
  # "每个 Pod 启动时自动生成一个"——那会导致 A 副本签的 token
  # 在 B 副本验签失败，用户表现为"登录后随机被踢出"。
  # 生成方式：openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_64_HEX_CHARS"

  # ---- 管理员初始口令 ----
  # 只在首次启动（库里还没有管理员）时使用。
  # 部署完成后建议立即在控制台改掉，并把这里改成一个无关的值。
  BOOTSTRAP_ADMIN_USER: "admin"
  BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"

  # ---- /metrics 抓取令牌 ----
  # 与用户 JWT 完全分离：监控系统拿的令牌不该能调业务接口。
  METRICS_TOKEN: "CHANGE_ME"

  # ---- 模型 ----
  EMBED_API_KEY: "CHANGE_ME"
  CHAT_API_KEY: "CHANGE_ME"

  # ---- 告警渠道 ----
  ALERT_WEBHOOK_URL: ""
  ALERT_SMTP_HOST: ""
  ALERT_SMTP_USER: ""
  ALERT_SMTP_PASSWORD: ""
  ALERT_SMTP_FROM: ""
  ALERT_MAIL_TO: ""

  # ---- SSO ----
  OIDC_CLIENT_SECRET: "CHANGE_ME"
