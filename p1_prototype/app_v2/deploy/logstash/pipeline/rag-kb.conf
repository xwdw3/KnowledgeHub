# Logstash 管道：采集 app 的 JSON 日志，写进 Elasticsearch 的按日索引。
#
# 为什么用 file input 而不是 tcp input：
#   tcp 是"推"模式，Logstash 重启或网络抖动期间到达的日志直接丢失。
#   file 是"拉"模式，靠 sincedb 记录读取位置，Logstash 挂掉再起来会从断点续读。
#   日志是事故现场，丢一段就可能丢掉关键证据。

input {
  file {
    path => ["/var/log/rag-kb/app.jsonl"]
    codec => json
    # 容器重建后 inode 会变，用 path 作为 sincedb 的标识才能正确续读
    sincedb_path => "/usr/share/logstash/data/sincedb_ragkb"
    start_position => "beginning"
    # 边写边读：文档解析日志可能几秒一条，5s 的间隔会让排障时看不到最新日志
    stat_interval => "2 seconds"
    discover_interval => "5 seconds"
  }
}

filter {
  # 应用已经是结构化 JSON，这里只做规整，不做正则抠字段。
  # 用正则解析自己的日志是最脆弱的做法：日志格式一改，整个索引的字段就全废了。

  # trace_id 缺省值 "-" 不该进 ES 的 keyword 字段做聚合，统一成 null
  if [trace_id] == "-" { mutate { remove_field => ["trace_id"] } }
  if [tenant_id] == "-" { mutate { remove_field => ["tenant_id"] } }

  # ts 与 @timestamp 重复，只保留标准的 @timestamp
  mutate { remove_field => ["ts"] }

  # 堆栈很长，单独截断：单条文档过大会拖慢整个 bulk 请求
  if [stack] {
    mutate { gsub => ["stack", "(?s)(.{20000}).*", "\1...(truncated)"] }
  }

  # 访问日志的 latency 分级，Kibana 里可以直接按这个桶画柱状图
  if [latency_ms] {
    if [latency_ms] < 100 { mutate { add_field => { "latency_bucket" => "<100ms" } } }
    else if [latency_ms] < 500 { mutate { add_field => { "latency_bucket" => "100-500ms" } } }
    else if [latency_ms] < 2000 { mutate { add_field => { "latency_bucket" => "0.5-2s" } } }
    else { mutate { add_field => { "latency_bucket" => ">2s" } } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 按日滚动索引：单索引无限增长会让分片越来越大，查询和恢复都变慢；
    # 按日切分后可以直接用 ILM 删掉超过保留期的索引。
    index => "rag-kb-logs-%{+YYYY.MM.dd}"
    # 不指定 document_id，让 ES 自动生成，避免并发写同 id 冲突
    manage_template => true
    template_name => "rag-kb-logs"
    template_overwrite => true
  }

  # 本地留一份，便于直接看 Logstash 收到了什么（不进 ES 也能排障）
  stdout {
    codec => rubydebug { metadata => false }
  }
}
